name=Horizon
description=This project focuses on developing flight control software for a custom-built UAV (Unmanned Aerial Vehicle) or rocket system. The software will handle flight stabilization, navigation, and telemetry data collection. It includes using sensors like the MPU6050 for monitoring position and orientation, integrating a Kalman Filter for data smoothing, and ensuring precise flight stabilization. The architecture will be modular and scalable, allowing for future upgrades and improvements. The goal is to achieve stable and reliable flight control in real-world conditions.
